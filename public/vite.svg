<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for second box -->
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a48fff"/>
      <stop offset="100%" stop-color="#c4c2ff"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Back box (left, rotated) -->
  <g transform="rotate(-12 28 40)">
    <rect x="25" y="22" width="8" height="28" rx="2" fill="#2d2b55" filter="url(#shadow1)" />
  </g>

  <!-- Front box (right, rotated and overlapping bottom of the back one) -->
  <g transform="rotate(12 36 40)">
    <rect x="33" y="22" width="8" height="28" rx="2" fill="url(#grad1)" filter="url(#shadow1)" />
  </g>
</svg>
