<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle: centered and perfectly round -->
  <circle cx="150" cy="150" r="100" fill="#c4c2ff" />

  <!-- Document shape -->
  <rect x="110" y="100" width="80" height="100" rx="6" ry="6" fill="#a48fff" />
  <polygon points="170,100 190,120 170,120" fill="#529fe0" />

  <!-- OTP label -->
  <rect x="125" y="135" width="50" height="30" rx="6" ry="6" fill="#64b5f6" />
  <text x="150" y="155" text-anchor="middle" fill="white" font-size="14" font-family="Arial">OTP</text>

  <!-- Confetti dots -->
  <circle cx="80" cy="130" r="6" fill="#F1608A" />
  <circle cx="220" cy="190" r="6" fill="#F1608A" />
  <circle cx="100" cy="200" r="6" fill="#7A5BF2" />
  <circle cx="190" cy="70" r="6" fill="#F39C12" />
  <circle cx="110" cy="70" r="6" fill="#1ABC9C" />
  <circle cx="220" cy="120" r="6" fill="#8E44AD" />
  <circle cx="170" cy="210" r="6" fill="#3498DB" />
  <circle cx="90" cy="90" r="6" fill="#E74C3C" />
  <circle cx="20" cy="90" r="6" fill="#E74C3C" />
  <circle cx="40" cy="200" r="6" fill="#E74C3C" />

  <!-- Confetti triangles and squares -->
  <polygon points="75,180 70,190 80,190" fill="#C0392B" />
  <polygon points="230,90 240,100 230,110" fill="#9B59B6" />
  <rect x="200" y="80" width="8" height="8" fill="#E67E22" />
  <rect x="120" y="20" width="8" height="8" fill="#E67E22" />
  <rect x="300" y="100" width="8" height="8" fill="#E67E22" />
  <rect x="60" y="100" width="8" height="8" fill="#2980B9" />
</svg>




